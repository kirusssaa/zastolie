<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Регистрация | Застолье</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="page">
  <header class="header">
    <a class="header__logo" href="index.html">Застолье</a>
    <nav class="header__nav">
      <a class="header__link" href="index.html">Главная</a>
      <a class="header__link header__link--active" href="register.html">Регистрация</a>
      <a class="header__link" href="login.html">Вход</a>
      <a class="header__link" href="orders.html">Мои заявки</a>
      <a class="header__link" href="create.html">Новая заявка</a>
      <a class="header__link" href="admin.html">Администратор</a>
    </nav>
  </header>

  <main class="main">
    <section class="auth">
      <h1 class="auth__title">Регистрация</h1>
      <form class="form" method="post" action="">
        <div class="form__group">
          <label class="form__label" for="fio">ФИО</label>
          <input class="form__input" type="text" id="fio" name="fio" placeholder="Маймуджан Бесмеля Уалейкум" required>
        <p class="form__hint">Только кириллица и пробелы</p>
        </div>
        <div class="form__group">
          <label class="form__label" for="login">Логин</label>
          <input class="form__input" type="text" id="login" name="login" placeholder="Besmelya" minlength="6" required>
        <p class="form__hint">Латиница и цифры, не короче 6 символов</p>
        </div>
        <div class="form__group">
          <label class="form__label" for="password">Пароль</label>
          <input class="form__input" type="password" id="password" name="password" placeholder="Не короче 6 символов" minlength="6" required>
        </div>
        <div class="form__group">
          <label class="form__label" for="phone">Телефон</label>
          <input class="form__input" type="tel" id="phone" name="phone" placeholder="+7(000)-000-00-00" required>
        <p class="form__hint">Формат: +7(XXX)-XXX-XX-XX</p>
        </div>
        <div class="form__group">
          <label class="form__label" for="email">Email</label>
          <input class="form__input" type="email" id="email" name="email" placeholder="3000Naliriky@mail.ru" required>
        </div>
        <button class="button form__submit" type="submit">Зарегистрироваться</button>
      </form>
      <p class="auth__link">Уже есть аккаунт? <a href="login.html">Войти</a></p>
    </section>
  </main>

  <footer class="footer">
    <p class="footer__text">Застолье — премиальный обеды</p>
    <p class="footer__text">+7(383)-200-20-20 · info@chaihana.ru</p>
    <p class="footer__text">© 2026</p>
  </footer>
</body>
</html>
