<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход | Застолье</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="page">
  <header class="header">
    <a class="header__logo" href="index.html">Застолье</a>
    <nav class="header__nav">
      <a class="header__link" href="index.html">Главная</a>
      <a class="header__link" href="register.html">Регистрация</a>
      <a class="header__link header__link--active" href="login.html">Вход</a>
      <a class="header__link" href="orders.html">Мои заявки</a>
      <a class="header__link" href="create.html">Новая заявка</a>
      <a class="header__link" href="admin.html">Администратор</a>
    </nav>
  </header>

  <main class="main">
    <section class="auth">
      <h1 class="auth__title">Вход</h1>
      <form class="form" method="post" action="">
        <p class="form__error form__error--box">Неверный логин или пароль</p>
        <div class="form__group">
          <label class="form__label" for="login">Логин</label>
          <input class="form__input" type="text" id="login" name="login" placeholder="Macbook pro m1" required>
        </div>
        <div class="form__group">
          <label class="form__label" for="password">Пароль</label>
          <input class="form__input" type="password" id="password" name="password" placeholder="Ваш пароль" required>
        </div>
        <button class="button form__submit" type="submit">Войти</button>
      </form>
      <p class="auth__link">Нет аккаунта? <a href="register.html">Заригистрироваться</a></p>
    </section>
  </main>

  <footer class="footer">
    <p class="footer__text">Застолье — премиальный обеды</p>
    <p class="footer__text">+7(383)-200-20-20 · info@chaihana.ru</p>
    <p class="footer__text">© 2026</p>
  </footer>
</body>
</html>
